<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Pool — EE-59-51</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 0; background: #0f1720; color: #e6edf3; }
    header { padding: 1rem; background: #15202b; display: flex; justify-content: space-between; align-items: center; gap: 1rem; flex-wrap: wrap; }
    header strong { white-space: nowrap; cursor: pointer; }
    @media (max-width: 640px) {
      header { flex-direction: column; align-items: stretch; gap: .6rem; }
      .hstatus { font-size: .8rem; color: #8b98a5; }
    }
    #banner { display: none; background: #7a1f1f; color: #fff; padding: .5rem 1rem; text-align: center; }
    #banner.show { display: block; }
    main { padding: 1rem; display: grid; gap: 1rem; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); }
    .card { background: #15202b; border-radius: 10px; padding: 1rem; box-shadow: 0 0 0 1px rgba(255,255,255,.1); }
    .card h2 { margin: 0 0 .5rem; font-size: .9rem; text-transform: uppercase; color: #8b98a5; }
    .big { font-size: 2rem; font-weight: 600; }
    .on { color: #3fb950; } .off { color: #6e7681; }
    ul { list-style: none; padding: 0; margin: 0; }
    li { display: flex; justify-content: space-between; padding: .25rem 0; }
    .hright { display:flex; align-items:center; gap:1rem; justify-content:space-between; }
    #menu { position:relative; }
    #menu-btn { background:#1b2735; color:#e6edf3; border:none; padding:.45rem .85rem; border-radius:8px; font-weight:600; cursor:pointer; }
    #menu-list { position:absolute; top:100%; right:0; left:auto; margin-top:.3rem; background:#15202b; border:1px solid rgba(255,255,255,.12); border-radius:10px; padding:.3rem; display:flex; flex-direction:column; gap:.2rem; min-width:150px; z-index:10; box-shadow:0 8px 24px rgba(0,0,0,.45); }
    #menu-list[hidden] { display:none; }
    .menu-item { background:none; border:none; color:#8b98a5; text-align:left; padding:.5rem .7rem; border-radius:7px; font-weight:600; cursor:pointer; white-space:nowrap; }
    .menu-item:hover { background:rgba(255,255,255,.06); }
    .menu-item.active { background:#1d6fb8; color:#fff; }
    .view[hidden] { display:none; }
    #toast { position:fixed; bottom:1rem; left:50%; transform:translateX(-50%); background:#7a1f1f; color:#fff; padding:.6rem 1rem; border-radius:8px; opacity:0; transition:opacity .2s; pointer-events:none; }
    #toast.show { opacity:1; }
    .ctl { max-width:520px; margin:0 auto; display:flex; flex-direction:column; gap:12px; }
    .tile { border-radius:18px; padding:16px; color:#fff; box-shadow:0 0 0 1px rgba(255,255,255,.12); transition:box-shadow .25s; }
    .tile.off { box-shadow:0 0 0 1px rgba(255,255,255,.12); }
    .tile.glow-pool { box-shadow:0 0 0 2px rgba(56,160,230,.95), 0 0 26px 3px rgba(29,111,184,.6); }
    .tile.glow-spa { box-shadow:0 0 0 2px rgba(240,150,90,.95), 0 0 26px 3px rgba(194,98,42,.6); }
    .tile.glow-spill { box-shadow:0 0 0 2px rgba(45,212,191,.95), 0 0 26px 3px rgba(14,165,183,.6); }
    .tile.glow-light { box-shadow:0 0 0 2px rgba(34,211,238,.95), 0 0 24px 3px rgba(8,145,178,.6); }
    .tile.pending { animation:pulse 1s ease-in-out infinite; }
    @keyframes pulse { 0%,100% { box-shadow:0 0 0 2px rgba(255,255,255,.5);} 50% { box-shadow:0 0 0 2px rgba(255,255,255,.95), 0 0 22px 3px rgba(255,255,255,.5);} }
    .lblrow { display:flex; align-items:center; gap:9px; }
    .ico { width:26px;height:26px;border-radius:50%;background:rgba(255,255,255,.2); display:inline-flex;align-items:center;justify-content:center;font-size:15px;}
    .lbl { text-transform:uppercase; letter-spacing:.08em; font-size:11px; }
    .sbadge { font-size:10px; background:rgba(255,255,255,.18); border-radius:999px; padding:2px 8px; white-space:nowrap; }
    .temp { font-size:38px; font-weight:700; line-height:1; }
    .pill { display:inline-flex; align-items:center; gap:8px; background:rgba(255,255,255,.2); border-radius:999px; padding:7px 14px; font-weight:600; font-size:13px; cursor:pointer; border:none; color:#fff; }
    .dot { width:9px;height:9px;border-radius:50%;background:rgba(255,255,255,.6);}
    .dot.on { background:#3fb950; box-shadow:0 0 9px #3fb950; }
    .stepper { display:inline-flex; align-items:center; gap:12px; background:rgba(255,255,255,.14); border-radius:10px; padding:5px 12px; font-weight:700; }
    .stepper button { background:none;border:none;color:#fff;font-size:18px;cursor:pointer;width:24px; }
    .cbtn { border:none; border-radius:10px; padding:8px 14px; font-weight:700; font-size:13px; color:#fff; cursor:pointer; }
    .confirm { background:#3fb950; } .cancel { background:rgba(255,255,255,.18); }
    .row2 { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
    .seclabel { text-transform:uppercase; letter-spacing:.08em; font-size:11px; color:#8b98a5; margin:8px 4px 0; }
    .infogrid { display:grid; gap:12px; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); margin-top:6px; }
    .tile.heating { box-shadow:0 0 0 2px rgba(239,68,68,.95), 0 0 30px 5px rgba(239,68,68,.6); animation: heatpulse 2.6s ease-in-out infinite; }
    @keyframes heatpulse { 0%,100% { box-shadow:0 0 0 2px rgba(239,68,68,.8), 0 0 22px 3px rgba(239,68,68,.45);} 50% { box-shadow:0 0 0 2px rgba(239,68,68,1), 0 0 40px 8px rgba(239,68,68,.8);} }
    .heatchip { border:none; border-radius:999px; padding:6px 12px; font-weight:700; font-size:13px; cursor:pointer; color:#fff; }
    .heatchip.dim { background:rgba(255,255,255,.14); opacity:.7; filter:grayscale(1); }
    .heatchip.lit { background:rgba(239,68,68,.30); box-shadow:0 0 12px rgba(239,68,68,.5); }
    .heatchip.firing { background:rgba(239,68,68,.6); animation: flicker 1.6s ease-in-out infinite alternate; }
    @keyframes flicker { from { opacity:.7; transform:scale(.97);} to { opacity:1; transform:scale(1.04);} }
    .heatrow { margin-top:14px; display:flex; align-items:center; gap:10px; }
    .hflame { font-size:18px; filter:grayscale(1); opacity:.55; transition:filter .2s, opacity .2s; }
    .hflame.lit { filter:none; opacity:1; }
    .hflame.firing { animation: flicker 1.6s ease-in-out infinite alternate; }
    .hlabel { font-size:13px; font-weight:600; }
    .hswitch { margin-left:auto; width:46px; height:26px; border-radius:999px; background:#39424d; border:none; position:relative; cursor:pointer; transition:background .2s; flex:none; }
    .hswitch.on { background:#ef4444; }
    .hknob { position:absolute; top:3px; left:3px; width:20px; height:20px; border-radius:50%; background:#fff; transition:left .2s; }
    .hswitch.on .hknob { left:23px; }
  </style>
</head>
<body>
  <header>
    <strong id="home" title="Control">Espino Pool</strong>
    <div class="hright">
      <span class="hstatus"><span id="air-temp"></span> <span id="controller-time">—</span> &nbsp; updated <span id="updated">—</span></span>
      <div id="menu">
        <button id="menu-btn" aria-haspopup="true" aria-expanded="false" aria-label="Menu">☰</button>
        <div id="menu-list" hidden>
          <button class="menu-item active" data-view="control">Control</button>
          <button class="menu-item" data-view="schedules">Schedules</button>
          <button class="menu-item" data-view="pumps">Pumps</button>
          <button class="menu-item" data-view="details">Details</button>
        </div>
      </div>
    </div>
  </header>
  <div id="banner">Disconnected — retrying…</div>
  <main id="view-control" class="view"></main>
  <main id="view-schedules" class="view" hidden></main>
  <main id="view-pumps" class="view" hidden></main>
  <main id="view-details" class="view" hidden></main>
  <div id="toast"></div>
  <script src="/app.js"></script>
</body>
</html>
